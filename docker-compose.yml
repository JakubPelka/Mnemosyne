services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MNEMOSYNE_DATABASE_PATH: /app/data/mnemosyne.sqlite3
      MNEMOSYNE_SOURCE_DIR: /app/sources
    ports:
      - "127.0.0.1:${MNEMOSYNE_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./sources:/app/sources:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MNEMOSYNE_FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
